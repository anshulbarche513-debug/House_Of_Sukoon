<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track order — House of Sukoon</title><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="brand" href="index.html"><img src="assets/logo.jpg" alt="House of Sukoon"><span>HOUSE OF<br><b>SUKOON</b></span></a><nav class="navlinks"><a href="collection.html">Collection</a><a href="ritual.html">The Ritual</a><a href="about.html">Our House</a></nav><div class="nav-actions"><a class="icon-btn" href="checkout.html">Bag</a></div></header>
<main class="section container"><div class="checkout-card" style="max-width:720px;margin:auto"><p class="kicker">GUEST ORDER TRACKING</p><h1>Find your <i>order.</i></h1><p class="lead">Enter the order ID from your confirmation email and the email address used at checkout.</p><form id="trackForm" class="form"><div class="field"><label>Order ID</label><input id="orderNumber" required placeholder="HS-…"></div><div class="field"><label>Email address</label><input id="email" type="email" required></div><button class="gold-btn" type="submit">Track order ↗</button></form><div id="status" class="notice hide" style="margin-top:20px"></div><div id="orderResult" class="hide" style="margin-top:28px"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const form=document.getElementById('trackForm'),status=document.getElementById('status'),result=document.getElementById('orderResult');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(t){status.textContent=t;status.classList.remove('hide');}
const q=new URLSearchParams(location.search);if(q.get('order'))document.getElementById('orderNumber').value=q.get('order');
form.addEventListener('submit',async e=>{e.preventDefault();result.classList.add('hide');setStatus('Finding your order…');try{const {data,error}=await sukoonSupabase.functions.invoke('track-order',{body:{order_number:document.getElementById('orderNumber').value,email:document.getElementById('email').value}});if(error)throw error;if(data?.error)throw new Error(data.error);const o=data.order;result.classList.remove('hide');result.innerHTML=`<div class="notice"><strong>${esc(o.order_number)}</strong><br>Payment: ${esc(o.payment_status)}<br>Order status: ${esc(o.order_status)}${o.payment_failure_description?`<br>Payment message: ${esc(o.payment_failure_description)}`:""}<br>Total: ₹${Number(o.total||0).toLocaleString('en-IN')}</div><h3 style="margin-top:24px">Items</h3>${(o.items||[]).map(i=>`<div class="summary-line"><span>${esc(i.product_name)} × ${i.quantity}</span><strong>₹${Number(i.total_price||0).toLocaleString('en-IN')}</strong></div>`).join('')}`;setStatus('Order found.');}catch(err){setStatus(err.message||'Unable to find order.');}});
</script></body></html>
