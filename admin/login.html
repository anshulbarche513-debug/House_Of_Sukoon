<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login — House of Sukoon</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
  </head>
  <body>
    <main class="login">
      <div class="login-art">
        <div class="login-art-copy">
          <div class="kicker">HOUSE OF SUKOON</div>
          <h1>Behind<br />the House.</h1>
          <p>Private administration for the collection, pricing and store.</p>
        </div>
      </div>
      <div class="login-form">
        <div class="form-box">
          <img class="logo" src="../assets/logo.jpg" />
          <div class="kicker" style="margin-top: 25px">ADMIN PORTAL</div>
          <h2>Welcome back.</h2>
          <p>Sign in securely with your Supabase account.</p>
          <form id="login">
            <div class="field">
              <label>Email</label
              ><input
                id="email"
                type="email"
                autocomplete="username"
                required
              />
            </div>
            <div class="field">
              <label>Password</label
              ><input
                id="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <p id="error" class="error"></p>
            <button id="submit" class="btn" type="submit">Sign in</button>
          </form>
          <p style="margin-top: 25px; font-size: 11px; color: #777">
            Admin access is controlled by the <code>admin_users</code> table in
            Supabase.
          </p>
          <a
            href="../index.html"
            style="
              display: block;
              margin-top: 20px;
              font-size: 11px;
              text-decoration: underline;
            "
            >← Return to storefront</a
          >
        </div>
      </div>
    </main>
    <script>
      const form = document.getElementById("login");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submit"),
          err = document.getElementById("error");
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Signing in…";
        try {
          const { data, error } = await sukoonSupabase.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          });
          if (error) throw error;
          const { data: admin, error: adminError } = await sukoonSupabase
            .from("admin_users")
            .select("id,email")
            .eq("id", data.user.id)
            .maybeSingle();
          if (adminError) throw adminError;
          if (!admin) {
            await sukoonSupabase.auth.signOut();
            throw new Error(
              "This account is not authorized for the admin portal.",
            );
          }
          location.href = "dashboard.html";
        } catch (ex) {
          err.textContent = ex.message || "Unable to sign in.";
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      });
    </script>
  </body>
</html>
